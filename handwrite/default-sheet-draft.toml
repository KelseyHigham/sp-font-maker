  # todo: replace these three, and `v`, with rotated lili. it would be cute i think
  {codepoint = 0x5e, width = 1000, name = "north",  writein = "^"},
  {codepoint = 0x3c, width = 1000, name = "west",   writein = "<"},
  {codepoint = 0x3e, width = 1000, name = "east",   writein = ">"},
