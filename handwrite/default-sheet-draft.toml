[glyphs.generated]
-=[
  # hardcoded in sheettopng.py; improve this when adding long pi
  # generated from row 6, cartoucheStartTok
    # (because in pixel fonts, the exact middle of the cartouche is on Start, not End.)
  {codepoint = 0xf1992, name = "cartoucheMiddleTok"},
]

[ligatures.aliases]
-=[ # implemented!!!
  # alternate spellings that are invisible to people who don't use them
  {ligature = "a l i",       target-name = "aleTok"},
  {ligature = "l i n u w i", target-name = "linluwiTok"},
  {ligature = "k e p e n",   target-name = "kepekenTok"},

  # alternate spellings for write-ins
  {ligature = "l a 2",       target-name = "mu2Tok"},
  {ligature = "m u 2",       target-name = "la2Tok"},

  # ni-numbers, from the ligature standard
  # (This will become nonstandard if someone draws alt ni in the normal square and standard ni in the custom square. It will require some special logic to fix.)
  {ligature = "n i zero one",   target-name = "niTok"},
  {ligature = "n i zero two",   target-name = "niTok.E"},
  {ligature = "n i zero three", target-name = "niTok.N"},
  {ligature = "n i zero four",  target-name = "niTok.W"},
  {ligature = "n i zero five",  target-name = "niTok.SE"},
  {ligature = "n i zero six",   target-name = "niTok.NE"},
  {ligature = "n i zero seven", target-name = "niTok.NW"},
  {ligature = "n i zero eight", target-name = "niTok.SW"},
  # todo: add nonstandard ni-numbers (ni1-ni8), but only after allowing other-words to override ligature-aliases in add_ligatures.py, line 180

  {ligature = "hyphen",      target-name = "stackJoinTok"},

  # candidate for removal later, because
    # it doesn't play well with HTML
    # it interferes with an alignment style that's easy to read and works across platforms:
        # soweli li wile moku
        # |      li lukin e sewi
        # |      |  |     e ma
        # |      |  |     e poka
        # |      li kama lukin e kili
        # |      |  |    |     | |    lon kasi
        # |      li moku e kili
    # here's that style with the interference:
        # soweli li wile moku
        # | li lukin e sewi
        # | | | e ma
        # | | | e poka
        # | li kama lukin e kili
        # | | | | | | lon kasi
        # | li moku e kili
  # in the future, full-width spaces can be inserted with `|`.
  # this removal may be disruptive, though, and should only be performed with community consensus.
  {ligature = "space space", target-name = "ideographicspace"},
]

# The following glyph names are prerequisites for custom ligatures. for example, the ligature "m u s i" has "m", "u", "s", "i" as prerequisites.
# This code currently runs in sheettopng.py, so `source-glyph` refers to the index of the glyph in `sorted_characters`.
# `sorted_characters` is the input sheet verbatim, plus the generated glyph `cartoucheMiddleTok` at index 180.
# If the implementation is moved to a later step, like svgtottf_ffpython.py, then it can hopefully reference a `target-name` instead of `source-glyph`.
[glyphs.duplicates]
-=[ # implemented!!!
  # punctuation
  {codepoint = 0x5b, name = "bracketleft",  writein = "[", source-glyph = 120}, # cartoucheStartTok
  {codepoint = 0x5f, name = "underscore",   writein = "_", source-glyph = 180}, # cartoucheMiddleTok
  {codepoint = 0x5d, name = "bracketright", writein = "]", source-glyph = 121}, # cartoucheEndTok
  {codepoint = 0x2e, name = "period",                      source-glyph = 122}, # middotTok
  {codepoint = 0x3a, name = "colon",                       source-glyph = 123}, # colonTok

  # already-a-word letters, for words like Anna
